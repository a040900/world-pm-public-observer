name: WORLD_PM_R6_FIXED_12_WINDOW_PM_R0
on:
  push:
    branches: [research/economic-first-reassessment-r1-20260930]
    paths:
      - tools/research/world_pm_r6_fixed_12_window_pm_r0.py
      - .github/workflows/world-pm-r6-fixed-12-window-pm-r0.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile tools/research/world_pm_r6_fixed_12_window_pm_r0.py
      - run: |
          mkdir -p artifacts
          PYTHONPATH=. python tools/research/world_pm_r6_fixed_12_window_pm_r0.py
      - if: always()
        run: |
          if [ -f artifacts/world-pm-r6-fixed-12-window-pm-r0.json ]; then
            sha256sum artifacts/world-pm-r6-fixed-12-window-pm-r0.json > artifacts/world-pm-r6-fixed-12-window-pm-r0.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-pm-r6-fixed-12-window-pm-r0-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
