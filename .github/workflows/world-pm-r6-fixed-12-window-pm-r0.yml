name: WORLD_PM_R6_COLLECTOR_OFFLINE_REPAIR_CHECK
on:
  push:
    branches: [research/economic-first-reassessment-r1-20260930, research/r6-capture-region-frozen-anchors]
    paths:
      - tools/research/world_pm_r6_fixed_12_window_pm_r0.py
      - .github/workflows/world-pm-r6-fixed-12-window-pm-r0.yml
      - tests/test_world_pm_r6_fixed_12_window_pm_r0.py
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile tools/research/world_pm_r6_fixed_12_window_pm_r0.py
      # A push validates the repair only. A new sample requires new authority;
      # there is intentionally no live collector or dispatch entry point here.
      - run: python -m unittest discover -s tests -p test_world_pm_r6_fixed_12_window_pm_r0.py -v
