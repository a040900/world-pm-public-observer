name: WORLD_BTC5M_DFLOW_BISON_ACCOUNT_ROLE_REFINEMENT_R2
on:
  push:
    branches: [research/economic-first-reassessment-r1-20260930]
    paths:
      - tools/research/world_btc5m_dflow_bison_account_role_refinement_r2.py
      - .github/workflows/world-btc5m-dflow-bison-account-role-refinement-r2.yml
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - run: python -m py_compile tools/research/world_btc5m_dflow_bison_account_role_refinement_r2.py
      - run: |
          mkdir -p artifacts
          PYTHONPATH=. python tools/research/world_btc5m_dflow_bison_account_role_refinement_r2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-btc5m-dflow-bison-account-role-refinement-r2-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
