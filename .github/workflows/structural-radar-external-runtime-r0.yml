name: Structural Radar External Runtime R0
on:
  push:
    branches: [runtime/structural-radar-r0-20260929]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - name: Validate payoff core
        run: |
          python -m unittest runtime_structural_radar.test_prediction_market_structural_constraint_core_r0 -v
          python -m py_compile runtime_structural_radar/prediction_market_structural_constraint_core_r0.py
