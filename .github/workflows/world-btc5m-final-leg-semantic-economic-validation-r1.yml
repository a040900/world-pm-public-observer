name: WORLD_BTC5M_FINAL_LEG_SEMANTIC_ECONOMIC_VALIDATION_R1
on:
  push:
    branches: [research/economic-first-reassessment-r1-20260930]
    paths:
      - tools/research/world_btc5m_final_leg_semantic_economic_validation_r1.py
      - .github/workflows/world-btc5m-final-leg-semantic-economic-validation-r1.yml
permissions:
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0 solders==0.29.0
      - run: python -m py_compile tools/research/world_btc5m_final_leg_semantic_economic_validation_r1.py
      - run: |
          mkdir -p artifacts
          PYTHONPATH=. python tools/research/world_btc5m_final_leg_semantic_economic_validation_r1.py --max-simulations 4
      - if: always()
        run: |
          if [ -f artifacts/world-btc5m-final-leg-semantic-economic-validation-r1.json ]; then
            sha256sum artifacts/world-btc5m-final-leg-semantic-economic-validation-r1.json > artifacts/world-btc5m-final-leg-semantic-economic-validation-r1.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-btc5m-final-leg-semantic-economic-validation-r1-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
