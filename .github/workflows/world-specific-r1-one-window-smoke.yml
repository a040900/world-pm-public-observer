name: WORLD_SPECIFIC_R1_ONE_WINDOW_ENGINEERING_SMOKE
on:
  push:
    branches: [main]
    paths: ['.github/run-requests/world-specific-r1-one-window-smoke.json']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - run: |
          mkdir -p artifacts
          python -m tools.research.world_pm_world_specific_incremental_r1 \
            --windows 1 \
            --protocol-authority "ENGINEERING_SMOKE_ZERO_RESEARCH_SCORE" \
            --source-commit "${GITHUB_SHA}" \
            --out artifacts/smoke.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/smoke.json"))
          w=x["windows"][0]
          d=w.get("collectorDiagnostics",{})
          assert d.get("cexMessageCount",{}).get("binance",0)>0,d
          assert d.get("cexMessageCount",{}).get("okx",0)>0,d
          assert d.get("pmFrameCount",0)>0,d
          assert d.get("worldFrameCount",0)>0,d
          assert w.get("healthyOverlapPollCount",0)>0,w
          assert w.get("qualificationValid") is True,w
          print(json.dumps({"qualificationValid":w["qualificationValid"],"healthyOverlapPollCount":w["healthyOverlapPollCount"],"collectorDiagnostics":d},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-specific-r1-engineering-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
