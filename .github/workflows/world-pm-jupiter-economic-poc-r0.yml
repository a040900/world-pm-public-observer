name: WORLD_PM_JUPITER_ECONOMIC_POC_R0
on:
  push:
    branches: [research/economic-first-reassessment-r1-20260930]
    paths:
      - tools/research/world_pm_jupiter_economic_poc_r0.py
      - .github/workflows/world-pm-jupiter-economic-poc-r0.yml
permissions:
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - run: |
          mkdir -p artifacts
          PYTHONPATH=. python tools/research/world_pm_jupiter_economic_poc_r0.py --request-cash 10 --snapshots 3 --interval-seconds 3
      - if: always()
        run: |
          if [ -f artifacts/world-pm-jupiter-economic-poc-r0.json ]; then
            sha256sum artifacts/world-pm-jupiter-economic-poc-r0.json > artifacts/world-pm-jupiter-economic-poc-r0.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-pm-jupiter-economic-poc-r0-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
