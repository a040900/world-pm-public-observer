name: WORLD_PM_FRESH_PROSPECTIVE_BATCH_R1
on:
  push:
    branches: [main]
    paths: ['.github/run-requests/maker-taker-r1.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-pm-fresh-prospective
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - name: Frozen measurement and runtime regression checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile tools/research/*.py
      - name: Select future schedule and run both read-only observers
        run: python -m tools.research.world_pm_fresh_batch_r1
      - name: Qualification result
        if: always()
        run: |
          if [ -f artifacts/batch.json ]; then
            python -c 'import json; b=json.load(open("artifacts/batch.json")); print("## " + b["qualificationStatus"]); print(json.dumps({k:b.get(k) for k in ("requestedWindowCount","validQualificationWindowCount","invalidExecutionWindowCount","qualificationValid","phaseAEligibleWindowCount","observedSeconds","unknownSeconds","scheduledSeconds","observationAvailability","frequencyScope")}, indent=2))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-batch-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
