name: WORLD_DISCOVERY_PRESTART_SPLIT_FIX_CHECK
on:
  push:
    branches: [fix/world-discovery-prestart-split-20260929]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - run: |
          python -m unittest tests.test_world_specific_incremental_r1 -v
          python -m unittest tests.test_world_specific_incremental_r1_runtime -v
          python -m tools.research.world_pm_world_specific_incremental_r1 --self-test
          python -m py_compile tools/research/world_polymarket_btc5m_leadlag_probe_r1.py tools/research/world_pm_world_specific_incremental_r1.py
