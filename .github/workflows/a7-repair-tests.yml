name: Maker lifecycle deterministic tests

on:
  push:
    branches:
      - "maker-lifecycle-condition-tape-r1"
      - "maker-postfix-accounting-r2"
      - "pf04-unknown-propagation-r1"
      - "execution-retry-buffer-r1"
      - "codex/qualification-runtime-repair"
      - "main"
  pull_request:
    paths:
      - "tools/research/world_pm_pm_maker_first_shadow_r1.py"
      - "tools/research/a7_public_trade_size_mapping_r1.py"
      - "tools/research/world_pm_condition_execution_tape_r1.py"
      - "tests/test_public_runner_r1.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile tools/research/*.py
