name: A7 repair deterministic tests

on:
  push:
    branches:
      - "a7-aggregate-size-repair-r1"
  pull_request:
    paths:
      - "tools/research/world_pm_pm_maker_first_shadow_r1.py"
      - "tools/research/a7_public_trade_size_mapping_r1.py"
      - "tests/test_public_runner_r1.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: python -m pip install requests==2.32.3 websockets==14.2 pycryptodome==3.23.0
      - run: python -m unittest tests.test_public_runner_r1 -v
